server:
  port: 8081

spring:
  application:
    name: tian-doc-parse-index-mcp-server
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:file:./data/knowledge;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

doc-mcp:
  endpoint: /mcp
  storage-dir: ./data
  parsed-dir: ./parsed
  runtime-dir: ./runtime
  parse-workers: 2
  allow-local-files: true
  max-source-bytes: 209715200
  chunk-sizes: 4096,1024,256
  chunk-overlap: 24
  retrieval-top-k: 30
  rerank-top-n: 8
  hybrid-dense-weight: 0.65
  hybrid-keyword-weight: 0.35
  hybrid-rrf-k: 60
  bm25-score-scale: 1.0
  mmr-relevance-weight: 0.78
  max-candidates-per-document: 4
  vector-store: milvus
  milvus:
    uri: http://127.0.0.1:19530
    token: root:Milvus
    database-name: default
    collection-name: knowledge_chunks
    keyword-collection-name: knowledge_chunks_bm25_v1
    memory-collection-name: agent_memories
    batch-size: 500
  mineru:
    enabled: true
    base-url: https://mineru.net
    token: ""
    poll-interval: 2s
    timeout: 30m
  embedding:
    provider: local
    model: text-embedding-v3
    dimensions: 1024
    batch-size: 10
    api-key: ""
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
  chat:
    model: qwen-plus
    api-key: ""
    endpoint: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    max-output-tokens: 2048
  evidence:
    minimum-relevant-score: 0.15
    minimum-sufficient-score: 0.35
    minimum-sources: 1
  wiki:
    output-dir: ./docs/wiki
    enabled: true
    auto-compile: true
    auto-publish: false
    max-attempts: 3
    batch-chars: 12000
    max-calls-per-job: 80
    max-facts-per-topic: 120
    max-synthesis-chars: 32000
    poll-interval-ms: 3000
    max-output-tokens: 4096
    request-timeout-seconds: 90
    lease-seconds: 300

logging:
  level:
    com.tianaiagent.docmcp: INFO
