# 天医：循证医疗信息与安全支持智能体开发环境配置
server:
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

knowledge-base:
  delete:
    max-attempts: 3
    initial-backoff-ms: 300
  upload:
    max-per-window: 100
    window-seconds: 60
  mcp:
    endpoint: ${KNOWLEDGE_MCP_ENDPOINT:http://127.0.0.1:8081/mcp}
    parse-tool: parse_document
    parse-batch-tool: parse_documents_batch
    parse-status-tool: get_parse_task
    parse-batch-window-ms: 1000
    parse-batch-max-size: 20
    # 文档服务默认解析并发较低，Admin侧限制批任务并发，避免远端解析API过载。
    parse-batch-concurrency: 1
    parse-poll-interval-ms: 2000
    parse-poll-max-consecutive-failures: 5
    parse-poll-retry-backoff-ms: 1000
    parse-timeout-seconds: 1800
    # 客户端在长时间空闲后主动刷新MCP会话。
    session-refresh-after-idle-seconds: 1500
    query-tool: query_knowledge
    retrieve-tool: retrieve_knowledge
    delete-tool: delete_document
  storage:
    # 开发环境中 Admin 与文档 MCP 均在本机运行，直接通过本地绝对路径交付原文。
    # 部署到不同主机或容器文件系统不共享时，显式设置 KB_STORAGE_MODE=oss 并配置 OSS 凭据。
    mode: ${KB_STORAGE_MODE:local}
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-wuhan-lr.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
    # 仅供文档服务及时下载，缩短泄露窗口；不要记录完整URL。
    url-expiration-seconds: ${OSS_URL_EXPIRATION_SECONDS:3600}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  application:
    name: tian-ai-agent-admin
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tianaiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

search-api:
  api-key: ${SEARCH_API_KEY:}

logging:
  level:
    # 医疗场景禁止 DEBUG 输出完整提示词和健康信息。
    org.springframework.ai: INFO

agent:
  memory:
    backend: ${AGENT_MEMORY_BACKEND:redis}
    max-messages: 200
    ttl-days: 30
    long-term:
      enabled: ${AGENT_LONG_TERM_MEMORY_ENABLED:false}
      compact-threshold: ${AGENT_MEMORY_COMPACT_THRESHOLD:80}
      compact-every-messages: ${AGENT_MEMORY_COMPACT_EVERY:20}
      semantic-top-k: ${AGENT_MEMORY_SEMANTIC_TOP_K:3}
      mysql:
        jdbc-url: ${AGENT_MEMORY_MYSQL_URL:localhost:3306}
        username: ${AGENT_MEMORY_MYSQL_USERNAME:root}
        password: ${AGENT_MEMORY_MYSQL_PASSWORD:123456}
      mcp:
        upsert-tool: upsert_long_term_memory
        search-tool: search_long_term_memory
        delete-tool: delete_long_term_memory
  task-center:
    core-pool-size: 4
    max-pool-size: 12
    queue-capacity: 200
  tool-gateway:
    blocked-tools: []
    max-argument-chars: 20000
    timeout-seconds: 30
    max-concurrency: 8
    audit-capacity: 500
    # 只有无副作用且同一轮内互不依赖的工具允许并行执行。
    parallel-safe-tools:
      - queryApprovedMedicalKnowledge
      - getKnowledgeChunkContext
      - searchPubMed
      - getPubMedArticle
      - verifyPubMedCitation
      - searchClinicalTrials
      - searchWeb
      - scrapeWebPage
  workflow:
    max-parallel-steps: 4
  rag:
    evidence:
      minimum-relevant-score: ${RAG_EVIDENCE_MIN_RELEVANT_SCORE:0.15}
      minimum-sufficient-score: ${RAG_EVIDENCE_MIN_SUFFICIENT_SCORE:0.35}
    semantic-cache:
      enabled: ${RAG_SEMANTIC_CACHE_ENABLED:true}
      similarity-threshold: ${RAG_CACHE_SIMILARITY_THRESHOLD:0.985}
      lexical-threshold: ${RAG_CACHE_LEXICAL_THRESHOLD:0.82}
      max-entries: ${RAG_CACHE_MAX_ENTRIES:500}
      ttl-hours: ${RAG_CACHE_TTL_HOURS:12}

medical-evidence:
  ncbi:
    api-key: ${NCBI_API_KEY:}
    email: ${NCBI_EMAIL:}
