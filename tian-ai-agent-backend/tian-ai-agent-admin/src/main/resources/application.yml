# 天医：循证医疗信息与安全支持智能体开发环境配置
server:
  port: 8123
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

knowledge-base:
  delete:
    max-attempts: 3
    initial-backoff-ms: 300
  upload:
    max-per-window: 100
    window-seconds: 60
  mcp:
    endpoint: http://127.0.0.1:8081/mcp
    parse-tool: parse_document
    parse-batch-tool: parse_documents_batch
    parse-status-tool: get_parse_task
    parse-batch-window-ms: 1000
    parse-batch-max-size: 20
    # 文档服务默认解析并发较低，Admin侧限制批任务并发，避免远端解析API过载。
    parse-batch-concurrency: 1
    parse-poll-interval-ms: 2000
    parse-poll-max-consecutive-failures: 5
    parse-poll-retry-backoff-ms: 1000
    parse-timeout-seconds: 1800
    # 客户端在长时间空闲后主动刷新MCP会话。
    session-refresh-after-idle-seconds: 1500
    query-tool: query_knowledge
    retrieve-tool: retrieve_knowledge
    delete-tool: delete_document
  storage:
    # 开发环境中 Admin 与文档 MCP 均在本机运行，直接通过本地绝对路径交付原文。
    # 文件系统不共享时，将 mode 改为 oss 并填写下面的 OSS 配置。
    mode: local
  oss:
    endpoint: oss-cn-wuhan-lr.aliyuncs.com
    access-key-id: ""
    access-key-secret: ""
    bucket: ""
    # 仅供文档服务及时下载，缩短泄露窗口；不要记录完整URL。
    url-expiration-seconds: 3600

spring:
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: tian_ai_agent
    password: 123456
    virtual-host: tian_ai_agent_vhost
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          # Retries are durable TTL queue hops, not in-memory Spring listener retries.
          enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  application:
    name: tian-ai-agent-admin
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  ai:
    dashscope:
      api-key: sk-ws-H.EDDMLMP.Awxr.MEUCIQCA7D8iAOKLZX1GJ7Uhc4WrJJroPjvoBeC3nhWEvep5DAIgK7zIalKnr83XLZTD3p-XV84OnszBD2Tl1kgPIk4GLIs
      chat:
        options:
          model: qwen-plus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.tianaiagent.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

search-api:
  api-key: ""

logging:
  level:
    # 医疗场景禁止 DEBUG 输出完整提示词和健康信息。
    org.springframework.ai: INFO
    # Spring AI 1.0 的 OpenAI 适配器会在空响应警告中记录完整提示词。
    org.springframework.ai.openai.OpenAiChatModel: ERROR

agent:
  model-routing:
    # 留空沿用 spring.ai.dashscope；多厂商配置见 README。
    providers: []
  wiki:
    max-depth: 2
    max-pages: 6
  user:
    # 初始化一个可手动登录的账号，不自动登录。
    default-username: zhangsan
    default-password: "123456"
  persistence:
    # MySQL is authoritative. Set file only for explicit legacy development mode.
    backend: mysql
    import-legacy-tasks: false
    mysql:
      jdbc-url: jdbc:mysql://localhost:3306/tian_ai_agent?connectTimeout=5000&socketTimeout=10000&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      username: root
      password: "123456"
  memory:
    backend: redis
    max-messages: 200
    # 仅限制 ReAct 的历史输入，不删除 Redis/File 原始记录；按完整用户回合裁剪。
    context-max-messages: 12
    context-max-chars: 12000
    ttl-days: 30
    long-term:
      enabled: false
      compact-threshold: 12
      # 兼容旧配置名，实际单位为达到阈值后的对话完成次数。
      compact-every-messages: 3
      semantic-top-k: 3
      mysql:
        jdbc-url: localhost:3306
        username: root
        password: "123456"
      mcp:
        upsert-tool: upsert_long_term_memory
        search-tool: search_long_term_memory
        delete-tool: delete_long_term_memory
  task-center:
    core-pool-size: 4
    max-pool-size: 12
    queue-capacity: 200
  tool-gateway:
    audit-rabbit:
      consumer-auto-startup: true
      exchange: tian.tool-audit.v1
      queue: tian.tool-audit.write.v1
      routing-key: write
      retry-exchange: tian.tool-audit.retry.v1
      retry-queue-prefix: tian.tool-audit.retry.v1
      dead-letter-exchange: tian.tool-audit.dead.v1
      dead-letter-queue: tian.tool-audit.dead.v1
      dead-letter-routing-key: dead
      # Initial insert + at most 3 retries (4 inserts). Retry delays: 1s, 2s, 4s.
      max-retries: 3
      retry-delay-ms: 1000
      confirm-timeout-ms: 5000
    blocked-tools: []
    max-argument-chars: 20000
    timeout-seconds: 30
    max-concurrency: 8
    audit-capacity: 500
    results:
      # CL100K本地估算，非Qwen精确分词；预算包含结果JSON及预览。
      # 为多篇文献摘要、5~8个RAG片段及父级上下文保留空间；更大的全文仍外置。
      max-tokens: 8192
      # 每次ReAct act批次的新结果总预算，不包含历史/系统提示词。
      batch-max-tokens: 24576
      directory: ""
      ttl-hours: 24
      max-disk-bytes: 268435456
    # 只有无副作用且同一轮内互不依赖的工具允许并行执行。
    parallel-safe-tools:
      - readToolResult
      - queryApprovedMedicalKnowledge
      - getKnowledgeChunkContext
      - searchPubMed
      - getPubMedArticle
      - verifyPubMedCitation
      - searchClinicalTrials
      - searchWeb
      - scrapeWebPage
  workflow:
    max-parallel-steps: 4
  rag:
    evidence:
      minimum-relevant-score: 0.15
      minimum-sufficient-score: 0.35
    semantic-cache:
      enabled: true
      similarity-threshold: 0.985
      lexical-threshold: 0.82
      max-entries: 500
      ttl-hours: 12

medical-evidence:
  ncbi:
    api-key: ""
    email: ""
