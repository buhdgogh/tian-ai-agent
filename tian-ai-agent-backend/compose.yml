name: tian-ai-agent

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_WEB_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tian_agent}
      MYSQL_USER: ${MYSQL_USER:-tian_agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  doc-mcp:
    build:
      context: ./tian-doc-parse-index-mcp-server
      dockerfile: Dockerfile
    environment:
      MCP_PORT: 8081
      VECTOR_STORE: milvus
      MILVUS_URI: http://milvus:19530
      MILVUS_TOKEN: root:Milvus
      MILVUS_DATABASE: default
      MILVUS_COLLECTION: knowledge_chunks
      MILVUS_MEMORY_COLLECTION: agent_memories
      KNOWLEDGE_DB_URL: jdbc:h2:file:/app/data/knowledge;DB_CLOSE_ON_EXIT=FALSE
      DOCUMENT_STORAGE_DIR: /app/data
      PARSED_DIR: /app/parsed
      DOCUMENT_RUNTIME_DIR: /app/runtime
      ALLOW_LOCAL_FILES: "true"
      MINERU_ENABLED: "true"
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      EMBEDDING_PROVIDER: dashscope
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in .env}
      JAVA_OPTS: ${DOC_MCP_JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${DOC_MCP_PORT:-8081}:8081"
    volumes:
      - doc_mcp_data:/app/data
      - doc_mcp_parsed:/app/parsed
      - doc_mcp_runtime:/app/runtime
      - ./docs/wiki:/app/docs/wiki
      - admin_data:/app/tmp:ro
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["sh", "-c", "exec java $$JAVA_OPTS -jar /app/app.jar --spring.profiles.active=docker"]
    environment:
      SERVER_PORT: 8123
      KNOWLEDGE_MCP_ENDPOINT: http://doc-mcp:8081/mcp
      KB_STORAGE_MODE: local
      AGENT_MEMORY_BACKEND: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AGENT_LONG_TERM_MEMORY_ENABLED: "true"
      AGENT_PERSISTENCE_BACKEND: mysql
      AGENT_IMPORT_LEGACY_TASKS: ${AGENT_IMPORT_LEGACY_TASKS:-false}
      AGENT_MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tian_agent}?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=10000&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      AGENT_MYSQL_USERNAME: ${MYSQL_USER:-tian_agent}
      AGENT_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      AGENT_MEMORY_MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tian_agent}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      AGENT_MEMORY_MYSQL_USERNAME: ${MYSQL_USER:-tian_agent}
      AGENT_MEMORY_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set DASHSCOPE_API_KEY in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      SPRING_APPLICATION_JSON: ${SPRING_APPLICATION_JSON:-}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      JAVA_OPTS: ${ADMIN_JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${ADMIN_PORT:-8123}:8123"
    volumes:
      - admin_data:/app/tmp
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      doc-mcp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  admin_data:
  doc_mcp_data:
  doc_mcp_parsed:
  doc_mcp_runtime:
  redis_data:
  mysql_data:
  rabbitmq_data:
  etcd_data:
  minio_data:
  milvus_data:
